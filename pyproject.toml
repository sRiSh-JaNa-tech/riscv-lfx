[project]
name = "podman-flaky-analyzer"
version = "0.1.0"
description = "Automated Flaky Test Analysis & Reporting Toolchain for containers/podman"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Apache-2.0" }

dependencies = [
    "httpx>=0.27",
    "litellm>=1.40",
    "openai>=1.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "black>=24.0",
    "flake8>=7.0",
    "mypy>=1.10",
]

[project.scripts]
analyze-ci-flake = "main:main"

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
